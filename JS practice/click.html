<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
        }
        #main{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        input{
            display: none;
        }
        #btn{
            padding: 15px 20px;
            background-color: rgb(85, 161, 74);
            color: white;
            border-radius: 5px;
        }
        #btn:hover{
            background-color: rgb(48, 91, 41);
            cursor: pointer;
            scale: 1.07;
        }

    </style>
</head>
<body>
   <div id="main">
<input id="fileinp" type="file">
<div id="btn">
    Upload File
</div>
   </div>
<script src="click.js"></script>
</body>
</html>
