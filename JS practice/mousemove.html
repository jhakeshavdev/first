<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
        }

        body{
            overflow: hidden;
            position: relative;
        }
        #abc{
            position: absolute;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) .2s;
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 20px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div id="abc"></div>
    <script src="mousemove.js"></script>
</body>
</html>
