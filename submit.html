<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
        }
          #main{
            /* display: flex;
            align-items: center;
            justify-content: center; */
            width: 100%;
            margin: 20px;
            height: 100%;
            background-color: #222;
        }
        input{
            display: block;
        }
        .card{
            max-width: 300px;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding:10px;
            border: 2px solid #555;
        }
        .profile{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card h5{
            margin-top: 3px;
        }
        .card p{
            font-size: 12px;
            margin-top:7px;
        } 
    </style>
</head>
<body>
   <div id="main">
     <form action="">
        <input type="text" placeholder="profile pic">
        <input type="text" placeholder="name">
        <input type="text" placeholder="occupation">
        <input type="text" placeholder="info">
        <input type="submit">
    </form>
     
     </div>

    <script src="submit.js"></script>
</body>
</html>
